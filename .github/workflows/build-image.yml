name: Build RSSHub image

on:
  push:
    branches: [deploy]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rsshub

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Bundle Chromium so the Playwright-based routes work.
          build-args: |
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:deploy
          cache-from: type=gha
          cache-to: type=gha,mode=max
